<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>登录</title><link rel="stylesheet" href="./styles.css" /><script src="./common.js"></script></head>
<body>
<div class="app" style="grid-template-columns:1fr;max-width:620px;margin:40px auto;min-height:auto;">
  <div class="main">
    <div class="topbar"><div><div class="title">🔥 城中村消防风险管理系统</div><div class="sub">请输入账号和密码登录系统</div></div></div>
    <div class="panel">
      <h3>账号登录</h3>
      <div class="grid" style="grid-template-columns:1fr;">
        <input id="username" placeholder="用户名" />
        <input id="password" type="password" placeholder="密码" />
        <button onclick="login()">登录</button>
      </div>
      <p class="sub" style="margin-top:10px;">登录后会根据账号角色自动进入：居民端 / 网格员端 / 管理员端。</p>
    </div>
  </div>
</div>
<script>
async function login(){
  try{
    const data=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});
    setToken(data.token); alert('登录成功：'+data.role);
    if(data.role==='ADMIN') location.href='./admin.html';
    else if(data.role==='GRID') location.href='./grid.html';
    else location.href='./resident.html';
  }catch(e){alert(e.message)}
}
</script></body></html>
