<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
</head>
<body class="login-page">
  <div class="login-shell alt">
    <section class="login-left-card">
      <div class="login-logo">FR</div>
      <h1>消防风险协同治理平台</h1>
      <p class="desc">隐患闭环 · 风险研判 · 地图联动 · 预警通知</p>
      <p class="desc">让基层消防治理更智能、更敏捷、更透明</p>

      <div class="tip-box">
        <h3>值班提醒</h3>
        <p>突发事件处置要点：先保证自身安全，协助他人；遇到不确定风险，保持距离并及时报警上报。</p>
      </div>

      <div class="tags">
        <span>前端：HTML + JS + CSS</span>
        <span>后端：Spring Boot + MySQL</span>
      </div>
    </section>

    <section class="login-right-card">
      <h2>账号登录</h2>
      <p class="sub">输入账号密码后按角色进入对应工作台</p>

      <label>* 用户名</label>
      <input id="loginUsername" placeholder="请输入用户名" value="admin" />

      <label>* 密码</label>
      <input id="loginPassword" type="password" placeholder="请输入密码" />

      <div class="remember-row">
        <label><input type="checkbox" checked /> 保持登录</label>
        <a class="link" href="#" onclick="fillDemo(event)">使用演示账号</a>
      </div>

      <button class="login-btn" onclick="login()">登录</button>

      <p class="auth-footer">没有账号？<a class="link" href="./register.html">点击这里注册居民账号</a></p>
      <p class="backend-tip">后端地址默认：<b>http://localhost:8080</b></p>
    </section>
  </div>

<script>
function fillDemo(e){
  e.preventDefault();
  loginUsername.value='admin';
  loginPassword.value='Password@123';
}

async function login(){
  try{
    const data=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({username:loginUsername.value,password:loginPassword.value})});
    setToken(data.token); alert('登录成功：'+data.role);
    if(data.role==='ADMIN') location.href='./admin.html';
    else if(data.role==='GRID') location.href='./grid.html';
    else location.href='./resident.html';
  }catch(e){alert(e.message)}
}
</script>
</body>
</html>
