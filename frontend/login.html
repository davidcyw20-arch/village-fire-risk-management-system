<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="topbar">
      <div>
        <div class="title">🔥 城中村消防风险管理系统</div>
        <div class="sub">请输入账号和密码登录</div>
      </div>
    </div>

    <div class="panel auth-card">
      <h3>账号登录</h3>
      <div class="grid" style="grid-template-columns:1fr;">
        <input id="loginUsername" placeholder="用户名" />
        <input id="loginPassword" type="password" placeholder="密码" />
        <button onclick="login()">登录</button>
      </div>
      <p class="auth-footer">还没有账号？<a class="link" href="./register.html">点击这里注册居民账号</a></p>
    </div>
  </div>

<script>
async function login(){
  try{
    const data=await apiFetch('/auth/login',{method:'POST',body:JSON.stringify({username:loginUsername.value,password:loginPassword.value})});
    setToken(data.token); alert('登录成功：'+data.role);
    if(data.role==='ADMIN') location.href='./admin.html';
    else if(data.role==='GRID') location.href='./grid.html';
    else location.href='./resident.html';
  }catch(e){alert(e.message)}
}
</script>
</body>
</html>
