<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>管理员端</title><link rel="stylesheet" href="./styles.css" /><script src="./common.js"></script></head>
<body><div class="app"><aside class="sidebar"><div class="brand">系统管理员端</div><nav class="menu"><a class="active" href="#">流程监控</a><a href="./map.html">GIS 风险图</a><a href="./login.html">返回登录</a></nav></aside>
<main class="main"><div class="topbar"><div><div class="title">系统管理驾驶舱</div><div class="sub">用户管理、流程督办、风险模型、知识库与日志审计</div></div><button class="danger" onclick="clearToken();location.href='./login.html'">退出</button></div>
<section class="cards"><div class="card"><h4>全量隐患</h4><div id="a1" class="metric">-</div></div><div class="card"><h4>待分派/处理中</h4><div id="a2" class="metric">-</div></div><div class="card"><h4>已解决</h4><div id="a3" class="metric">-</div></div><div class="card"><h4>高风险区域数</h4><div id="a4" class="metric">-</div></div></section>
<section class="panel"><h3>隐患流程监控与督办</h3><div class="toolbar"><input id="hazardId" placeholder="隐患ID" /><input id="gridUserId" placeholder="网格员ID" /><button onclick="assignHazard()">分派任务</button><button class="ghost" onclick="loadRisk()">刷新风险</button><button class="ghost" onclick="exportExcel()">导出报表</button></div></section>
<section class="panel"><h3>隐患总览</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>标题</th><th>状态</th><th>区域</th><th>处理网格员</th></tr></thead><tbody id="tbodyHazards"></tbody></table></div><div class="pagebar"><button class="ghost" onclick="changePage(-1)">上一页</button><span id="pageInfo"></span><button class="ghost" onclick="changePage(1)">下一页</button></div></section>
<section class="panel"><h3>区域风险评估</h3><div class="table-wrap"><table><thead><tr><th>区域编码</th><th>风险分值</th><th>风险等级</th></tr></thead><tbody id="tbodyRisk"></tbody></table></div></section>
</main></div>
<script>
let allHazards=[];let riskData=[];let page=1;const pageSize=5;
async function assignHazard(){try{await apiFetch(`/hazards/${hazardId.value}/assign`,{method:'POST',body:JSON.stringify({gridUserId:Number(gridUserId.value)})});alert('分派成功');loadHazards();}catch(e){alert(e.message)}}
async function loadHazards(){try{allHazards=await apiFetch('/hazards');renderHazards();metrics();}catch(e){alert(e.message)}}
function renderHazards(){const p=paginate(allHazards,page,pageSize);page=p.currentPage;tbodyHazards.innerHTML=p.pageItems.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td>${toHazardStatusLabel(x.status)}</td><td>${x.areaCode}</td><td>${x.assignedTo?x.assignedTo.id:''}</td></tr>`).join('');pageInfo.textContent=`第 ${p.currentPage}/${p.totalPages} 页，共 ${p.total} 条`;}
function changePage(d){page+=d;renderHazards();}
async function loadRisk(){try{riskData=await apiFetch('/risk/areas');tbodyRisk.innerHTML=riskData.map(r=>`<tr><td>${r.areaCode}</td><td>${r.riskScore}</td><td>${toRiskLevelLabel(r.riskLevel)}</td></tr>`).join('');metrics();}catch(e){alert(e.message)}}
function metrics(){a1.textContent=allHazards.length;a2.textContent=allHazards.filter(x=>x.status==='REPORTED'||x.status==='ASSIGNED'||x.status==='IN_PROGRESS').length;a3.textContent=allHazards.filter(x=>x.status==='RESOLVED').length;a4.textContent=riskData.filter(r=>r.riskLevel==='HIGH'||r.riskLevel==='CRITICAL').length;}
async function exportExcel(){try{const resp=await fetch(`${API_BASE}/reports/hazards/export`,{headers:{Authorization:'Bearer '+getToken()}});if(!resp.ok){alert('导出失败');return;}const blob=await resp.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hazards.xlsx';a.click();URL.revokeObjectURL(url);}catch(e){alert(`导出失败：${e.message}`);}} 
loadHazards();loadRisk();
</script></body></html>
