<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>管理员端</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="toolbar" style="justify-content:space-between;">
      <h2>管理员端 · 分派与风险查看</h2>
      <button class="danger" onclick="clearToken();location.href='./login.html'">退出登录</button>
    </div>
    <div class="toolbar">
      <input id="hazardId" placeholder="隐患ID" />
      <input id="gridUserId" placeholder="网格员用户ID" />
      <button onclick="assignHazard()">执行分派</button>
      <button class="ghost" onclick="loadRisk()">刷新风险区域</button>
      <button class="ghost" onclick="exportExcel()">导出Excel报表</button>
    </div>
  </div>

  <div class="panel">
    <h3>隐患列表</h3>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>标题</th><th>状态</th><th>区域</th><th>assigned_to</th></tr></thead><tbody id="tbodyHazards"></tbody></table></div>
    <div class="pagebar"><button class="ghost" onclick="changePage(-1)">上一页</button><span id="pageInfo" class="muted"></span><button class="ghost" onclick="changePage(1)">下一页</button></div>
  </div>

  <div class="panel">
    <h3>区域风险</h3>
    <div class="table-wrap"><table><thead><tr><th>area_code</th><th>risk_score</th><th>risk_level</th></tr></thead><tbody id="tbodyRisk"></tbody></table></div>
  </div>
</div>
<script>
let allHazards=[];let page=1;const pageSize=5;
async function assignHazard(){
  try{
    await apiFetch(`/hazards/${hazardId.value}/assign`, {method:'POST', body: JSON.stringify({gridUserId:Number(gridUserId.value)})});
    alert('分派成功');
    loadHazards();
  }catch(e){alert(e.message)}
}
async function loadHazards(){
  try{allHazards=await apiFetch('/hazards');renderHazards();}catch(e){alert(e.message)}
}
function renderHazards(){
  const p = paginate(allHazards,page,pageSize); page=p.currentPage;
  tbodyHazards.innerHTML = p.pageItems.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td>${x.status}</td><td>${x.areaCode}</td><td>${x.assignedTo?x.assignedTo.id:''}</td></tr>`).join('');
  pageInfo.textContent=`第 ${p.currentPage}/${p.totalPages} 页，共 ${p.total} 条`;
}
function changePage(d){page+=d;renderHazards();}
async function loadRisk(){
  try{
    const risk = await apiFetch('/risk/areas');
    tbodyRisk.innerHTML = risk.map(r=>`<tr><td>${r.areaCode}</td><td>${r.riskScore}</td><td>${r.riskLevel}</td></tr>`).join('');
  }catch(e){alert(e.message)}
}
async function exportExcel(){
  const resp = await fetch('http://localhost:8080/api/v1/reports/hazards/export', {headers:{Authorization:'Bearer '+getToken()}});
  if(!resp.ok){ alert('导出失败'); return; }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='hazards.xlsx'; a.click();
  URL.revokeObjectURL(url);
}
loadHazards();loadRisk();
</script>
</body>
</html>
