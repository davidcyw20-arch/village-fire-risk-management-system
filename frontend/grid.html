<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>网格员端</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="toolbar" style="justify-content:space-between;">
      <h2>网格员端 · 隐患处理</h2>
      <button class="danger" onclick="clearToken();location.href='./login.html'">退出登录</button>
    </div>
    <div class="toolbar">
      <input id="hazardId" placeholder="隐患ID" />
      <input id="note" placeholder="处理说明" style="flex:1;min-width:200px;" />
      <select id="targetStatus"><option>IN_PROGRESS</option><option>RESOLVED</option><option>REJECTED</option></select>
      <button onclick="processHazard()">提交处理</button>
    </div>
  </div>

  <div class="panel">
    <h3>隐患列表</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>状态</th><th>分派人</th><th>网格员</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagebar"><button class="ghost" onclick="changePage(-1)">上一页</button><span id="pageInfo" class="muted"></span><button class="ghost" onclick="changePage(1)">下一页</button></div>
  </div>
</div>
<script>
let allData=[];let page=1;const pageSize=5;
async function processHazard(){
  try{
    await apiFetch(`/hazards/${hazardId.value}/process`, {method:'POST', body:JSON.stringify({note: note.value, targetStatus: targetStatus.value})});
    alert('处理提交成功');
    loadData();
  }catch(e){alert(e.message)}
}
async function loadData(){
  try{allData = await apiFetch('/hazards');render();}catch(e){alert(e.message)}
}
function render(){
  const p = paginate(allData,page,pageSize); page = p.currentPage;
  tbody.innerHTML = p.pageItems.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td>${x.status}</td><td>${x.assignedBy?x.assignedBy.username||x.assignedBy.id:''}</td><td>${x.assignedTo?x.assignedTo.username||x.assignedTo.id:''}</td></tr>`).join('');
  pageInfo.textContent = `第 ${p.currentPage}/${p.totalPages} 页，共 ${p.total} 条`;
}
function changePage(d){page+=d;render()}
loadData();
</script>
</body>
</html>
