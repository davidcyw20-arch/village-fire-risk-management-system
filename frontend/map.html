<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GIS 地图</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="toolbar" style="justify-content:space-between;">
      <h2>GIS 地图 · 隐患点位</h2>
      <button class="danger" onclick="clearToken();location.href='./login.html'">退出登录</button>
    </div>
    <div class="toolbar">
      <span class="muted">点击地图可获取经纬度：</span>
      <input id="lat" placeholder="lat" readonly />
      <input id="lng" placeholder="lng" readonly />
      <button class="ghost" onclick="loadHazards()">刷新隐患点</button>
    </div>
    <div id="map"></div>
  </div>
</div>
<script>
const map = L.map('map').setView([31.2304, 121.4737], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
let markerGroup = L.layerGroup().addTo(map);

map.on('click', (e)=>{
  lat.value = e.latlng.lat.toFixed(7);
  lng.value = e.latlng.lng.toFixed(7);
  L.popup().setLatLng(e.latlng).setContent(`lat: ${lat.value}<br>lng: ${lng.value}`).openOn(map);
});

async function loadHazards(){
  try{
    const hazards = await apiFetch('/hazards');
    markerGroup.clearLayers();
    hazards.forEach(h=>{
      if(h.latitude && h.longitude){
        L.marker([Number(h.latitude), Number(h.longitude)]).addTo(markerGroup)
          .bindPopup(`<b>${h.title}</b><br/>类型:${h.hazardType}<br/>状态:${h.status}<br/>地址:${h.address}`);
      }
    });
  }catch(e){alert(e.message)}
}

loadHazards();
</script>
</body>
</html>
