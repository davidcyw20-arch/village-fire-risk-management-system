<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><title>风险地图</title><link rel="stylesheet" href="./styles.css" /><script src="./common.js?v=20260305"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script></head>
<body><div class="app"><aside class="sidebar"><div class="brand">风险可视化</div><nav class="menu"><a class="active" href="#">风险地图</a><a href="./resident.html">居民端</a><a href="./grid.html">网格员端</a><a href="./admin.html">管理员端</a></nav></aside>
<main class="main"><div class="topbar"><div><div class="title">风险地图与隐患点位</div><div class="sub">按状态/类型直观展示隐患分布，支持点击取经纬度</div></div><button class="danger" onclick="clearToken();location.href='./login.html'">退出</button></div>
<section class="cards"><div class="card"><h4>隐患总数</h4><div id="m1" class="metric">-</div></div><div class="card"><h4>未处理</h4><div id="m2" class="metric">-</div></div><div class="card"><h4>处理中</h4><div id="m3" class="metric">-</div></div><div class="card"><h4>已处理</h4><div id="m4" class="metric">-</div></div></section>
<section class="panel"><div class="toolbar"><span class="sub">点击地图获取坐标：</span><input id="lat" readonly placeholder="纬度" /><input id="lng" readonly placeholder="经度" /><button class="ghost" onclick="loadHazards()">刷新点位</button></div><div id="map"></div></section>
</main></div>
<script>
const map = L.map('map').setView([31.2304,121.4737], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20}).addTo(map);
let markerGroup = L.layerGroup().addTo(map);

const statusColor = {
  REPORTED: '#f59e0b',
  ASSIGNED: '#f97316',
  IN_PROGRESS: '#3b82f6',
  RESOLVED: '#10b981',
  REJECTED: '#ef4444'
};

const typeEmoji = {
  BLOCKED_EXIT:'🚧',
  GAS_LEAK:'⛽',
  ELECTRICAL:'⚡',
  FIRE_FACILITY_DAMAGE:'🧯',
  ILLEGAL_STORAGE:'🛢️'
};

map.on('click', e => {
  lat.value = e.latlng.lat.toFixed(7);
  lng.value = e.latlng.lng.toFixed(7);
  L.popup().setLatLng(e.latlng).setContent(`纬度:${lat.value}<br>经度:${lng.value}`).openOn(map);
});

function markerStyle(status){
  const c = statusColor[status] || '#6b7280';
  return {radius: 9, color: '#ffffff', weight: 2, fillColor: c, fillOpacity: 0.95};
}

async function loadHazards(){
  try{
    const hazards = await apiFetch('/hazards');
    m1.textContent = hazards.length;
    m2.textContent = hazards.filter(h=>h.status==='REPORTED'||h.status==='ASSIGNED').length;
    m3.textContent = hazards.filter(h=>h.status==='IN_PROGRESS').length;
    m4.textContent = hazards.filter(h=>h.status==='RESOLVED').length;

    markerGroup.clearLayers();
    const pts = [];

    hazards.forEach(h=>{
      if(h.latitude && h.longitude){
        const latNum = Number(h.latitude);
        const lngNum = Number(h.longitude);
        pts.push([latNum, lngNum]);
        const em = typeEmoji[h.hazardType] || '📍';
        const popup = `<b>${em} ${h.title}</b><br/>`
          + `类型：${toHazardTypeLabel(h.hazardType)}<br/>`
          + `状态：${toHazardStatusLabel(h.status)}<br/>`
          + `坐标：${latNum.toFixed(7)}, ${lngNum.toFixed(7)}<br/>`
          + `地址：${h.address}`;

        L.circleMarker([latNum, lngNum], markerStyle(h.status))
          .addTo(markerGroup)
          .bindPopup(popup);
      }
    });

    if(pts.length){
      map.fitBounds(pts, {padding:[30,30], maxZoom:18});
    }
  }catch(e){alert(e.message)}
}

loadHazards();
</script></body></html>
