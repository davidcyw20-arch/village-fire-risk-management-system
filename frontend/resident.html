<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>居民端</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./common.js"></script>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="toolbar" style="justify-content:space-between;">
      <h2>居民端 · 隐患上报</h2>
      <button class="danger" onclick="clearToken();location.href='./login.html'">退出登录</button>
    </div>
    <div class="grid">
      <input id="title" placeholder="标题" />
      <input id="hazardType" placeholder="类型，如 GAS_LEAK" />
      <input id="areaCode" placeholder="区域编码，如 A001" />
      <input id="address" placeholder="地址" />
      <input id="latitude" placeholder="纬度" />
      <input id="longitude" placeholder="经度" />
      <input id="imageUrl" placeholder="图片URL（先调用上传接口）" style="grid-column:1/-1;" />
      <select id="severity">
        <option>LOW</option><option selected>MID</option><option>HIGH</option><option>CRITICAL</option>
      </select>
      <button onclick="reportHazard()">提交上报</button>
      <textarea id="description" placeholder="隐患描述" style="grid-column:1/-1;"></textarea>
    </div>
  </div>

  <div class="panel">
    <h3>隐患列表 <span class="badge">分页展示</span></h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>类型</th><th>状态</th><th>区域</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagebar">
      <button class="ghost" onclick="changePage(-1)">上一页</button>
      <span id="pageInfo" class="muted"></span>
      <button class="ghost" onclick="changePage(1)">下一页</button>
    </div>
  </div>
</div>
<script>
let allData=[]; let page=1; const pageSize=5;
async function reportHazard(){
  try{
    await apiFetch('/hazards', {method:'POST', body: JSON.stringify({
      title: title.value, description: description.value, hazardType: hazardType.value,
      areaCode: areaCode.value, address: address.value,
      latitude: Number(latitude.value), longitude: Number(longitude.value),
      imageUrl: imageUrl.value, severity: severity.value
    })});
    alert('上报成功');
    loadHazards();
  }catch(e){alert(e.message)}
}
async function loadHazards(){
  try{allData = await apiFetch('/hazards'); render();}catch(e){alert(e.message)}
}
function render(){
  const p = paginate(allData,page,pageSize); page = p.currentPage;
  tbody.innerHTML = p.pageItems.map(x=>`<tr><td>${x.id}</td><td>${x.title}</td><td>${x.hazardType}</td><td>${x.status}</td><td>${x.areaCode}</td></tr>`).join('');
  pageInfo.textContent = `第 ${p.currentPage}/${p.totalPages} 页，共 ${p.total} 条`;
}
function changePage(delta){ page += delta; render(); }
loadHazards();
</script>
</body>
</html>
